<!DOCTYPE html>
<html lang="en">

<head>
    <title>Twidder</title>
    <link href="client.css" type="text/css" rel="stylesheet">
    <script src="client.js" type="text/javascript"></script>
    <script src="serverstub.js" type="text/javascript"></script>
    <script id="welcome-view" type=”text/view”>
        <div class="welcome-view-body">
            <div class="logo-container">
                <img src="Twidder_custom_logo.png" alt="Twidder logo and slogan.">
            </div>
    
            <div class="login-container">
                <form>
                    <div>
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" required>
                    </div>
    
                    <div>
                        <label for="login-password">Password</label>
                        <input id="login-password" name="login-password" type="password" required>
                    </div>
    
                    <input id="login" class="submit" type="submit" value="Login">
                </form>
            </div>
    
            <div class="signup-container">
                <form>
                    <div>
                        <label for="first-name">First Name</label>
                        <input id="first-name" name="first-name" type="text" required>
                    </div>
    
                    <div>
                        <label for="last-name">Last Name</label>
                        <input id="last-name" name="last-name" type="text" required>
                    </div>
    
                    <div>
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
    
                    </div>
    
                    <div>
                        <label for="city">City</label>
                        <input id="city" name="city" type="text" required>
                    </div>
    
                    <div>
                        <label for="country">Country</label>
                        <input id="country" name="country" type="text" required>
                    </div>
    
                    <div>
                        <label for="signup-email">Email</label>
                        <input id="signup-email" name="signup-email" type="email" required>
                    </div>
    
                    <div>
                        <label for="signup-password">Password</label>
                        <input id="signup-password" name="signup-password" type="password" required>
    
                    </div>
    
                    <div>
                        <label for="signup-repeat-password">Repeat PSW</label>
                        <input id="signup-repeat-password" name="signup-reapeat-password" type="password" required>
                    </div>
    
                    <input id="signup" class="submit" type="submit" value="Sign Up">
                </form>
            </div>
        </div>
    </script>
    <script id="profile-view" type=”text/view”>
        <h1>Profile View</h1>
    </script>
</head>

<body>
    <div id="view">

    </div>
</body>

</html>
