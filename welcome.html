<!DOCTYPE html>
<html lang="en">

<head>
    <title>Welcome</title>
    <link href="welcome.css" type="text/css" rel="stylesheet">
</head>

<body>
    <div class="main-container">
         <div class="logo-container">
            <img src="Twidder_custom_logo.png" alt="Twidder logo and slogan.">
         </div>
         
         <div class="login-container">
            <form action="" method="post">
                <label for="email">Email</label> 
                <input id="email" name="email" type="email">

                <label for="login-password">Password</label> 
                <input id="login-password" name="login-password" type="password">
            </form>
            <input id="login" class="submit" type="submit" value="Login">
         </div>
         
         <div class="signup-container">
            <form action="" method="post">
                <label for="first-name">First Name</label> 
                <input id="first-name" name="first-name" type="text">

                <label for="last-name">Last Name</label> 
                <input id="last-name" name="last-name" type="text">

                <label for="gender" name="gender">Gender</label> 
                <select id="gender">
                    <option value="m">Male</option>
                    <option value="f">Female</option>
                </select>

                <label for="city">Home City</label> 
                <input id="city" name="city" type="text">

                <label for="email">Country</label> 
                <input id="email" name="email" type="email">
                
                <label for="email">Email</label> 
                <input id="email" name="email" type="email">

                <label for="sign-password">Password</label> 
                <input id="signup-password" name="signup-password" type="password">

                <label for="signup-repeat-password">Repeat PSW</label> 
                <input id="signup-repeat-password" name="signup-reapeat-password" type="password">
            </form>
            <input id="signup" class="submit" type="submit" value="Sign Up">
         </div>
    </div>
</body>

</html>
